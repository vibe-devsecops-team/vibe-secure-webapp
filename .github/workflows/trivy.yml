name: Trivy Scan

on:
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    name: Trivy Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Trivy
        run: |
          wget https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz
          tar -xzf trivy_0.72.0_Linux-64bit.tar.gz
          sudo mv trivy /usr/local/bin/

      - name: Build backend image
        run: docker build -t vibe-backend:test ./backend

      - name: Build frontend image
        run: docker build -t vibe-frontend:test ./frontend

      - name: Scan backend image
        run: trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed vibe-backend:test

      - name: Scan frontend image
        run: trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed vibe-frontend:test
